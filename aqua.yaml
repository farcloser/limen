# aqua — Declarative CLI Version Manager — https://aquaproj.github.io/
checksum:
  enabled: true
  require_checksum: true
  supported_envs:
    - darwin/arm64
    - linux/amd64
    - linux/arm64
    - windows/amd64
    - windows/arm64

registries:
  - type: standard
    ref: v4.551.0 # renovate: depName=aquaproj/aqua-registry
  - name: local
    type: local
    path: .limen/aqua-registry.yaml

packages:
  # --- go install tools (local registry, GOSUMDB-verified) ---
  # Two-line form with a `_go/` depName for the github.com-hosted ones: the
  # aqua preset's one-line manager cannot read a dotted owner ("github.com"),
  # so those pins were invisible to Renovate; the `_go/<module>` hook routes
  # them to Renovate's go datasource (module tags), exactly as the golang.org
  # ones already are. limen fix rewrites the one-line form of these packages.
  - name: github.com/google/go-licenses/v2
    version: v2.0.1 # renovate: depName=_go/github.com/google/go-licenses/v2
    registry: local
  - name: github.com/vbatts/git-validation
    version: v1.2.2 # renovate: depName=_go/github.com/vbatts/git-validation
    registry: local
  - name: golang.org/x/vuln/cmd/govulncheck@v1.7.0
    registry: local
  - name: golang.org/x/tools/cmd/deadcode@v0.49.0
    registry: local
  # Pseudo-version: the nested cmd/dot module carries no tags upstream, so
  # nothing for Renovate to propose either — bumped by hand, deliberately.
  - name: github.com/goccy/go-graphviz/cmd/dot@v0.0.0-20251129032125-76e04975df88
    registry: local
  - name: github.com/farcloser/godolint/cmd/godolint
    version: v0.1.0 # renovate: depName=_go/github.com/farcloser/godolint/cmd/godolint
    registry: local
  # --- farcloser tools (local registry; standard once registered upstream) ---
  - name: farcloser/limen@v0.0.1 # renovate: depName=farcloser/limen
    registry: local
  # --- toolchain + binary-release tools (standard registry, aqua-verified) ---
  # Two-line form for the tools whose upstream tags carry a prefix (go1.x,
  # jq-1.x): Renovate's aqua preset only knows how to strip those prefixes when
  # the version sits on its own line under a `# renovate: depName=` comment. In
  # the one-line name@version form the preset reads "go1.26.6" as the version,
  # cannot parse it, and silently never proposes a bump. limen fix rewrites the
  # one-line form of these packages to this shape.
  - name: golang/go
    version: go1.26.6 # renovate: depName=golang/go
  - name: casey/just@1.58.0
  - name: koalaman/shellcheck@v0.11.0
  - name: golangci/golangci-lint@v2.12.2
  - name: google/yamlfmt@v0.21.0
  - name: lycheeverse/lychee@lychee-v0.24.2
  - name: goreleaser/goreleaser@v2.17.1
  - name: sigstore/cosign@v3.1.3
  - name: gotestyourself/gotestsum@v1.13.0
  - name: jqlang/jq
    version: jq-1.8.2 # renovate: depName=jqlang/jq
  - name: cli/cli@v2.96.0
