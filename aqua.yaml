# aqua — Declarative CLI Version Manager — https://aquaproj.github.io/
checksum:
  enabled: true
  require_checksum: true
  supported_envs:
    - darwin/arm64
    - linux/amd64
    - linux/arm64
    - windows/amd64
    - windows/arm64

registries:
  - type: standard
    ref: v4.544.0 # renovate: depName=aquaproj/aqua-registry
  - name: local
    type: local
    path: .limen/aqua-registry.yaml

packages:
  # Every pin is the one-line name@version form, and stays so (limen fix
  # collapses any two-line `version:` pin): `aqua update` — what
  # `just do tools update <cmd>` runs — rewrites only that form, and treats a
  # separate `version:` key as a hand-held pin it must not touch. Renovate reads
  # the one-line form for every package here: the aqua preset's generic manager
  # for owner/repo@vX pins, its dedicated prefix-aware managers for golang/go
  # (go1.x) and jqlang/jq (jq-1.x), its golang.org/ manager for the x/ tools,
  # and — because the preset's generic manager cannot read a dotted owner such
  # as "github.com" — renovate.json5's own manager for the github.com/… go
  # modules below (Renovate's go datasource: repo tags, /vN-aware).
  # --- go install tools (local registry, GOSUMDB-verified) ---
  - name: github.com/google/go-licenses/v2@v2.0.1
    registry: local
  - name: github.com/vbatts/git-validation@v1.2.2
    registry: local
  - name: golang.org/x/vuln/cmd/govulncheck@v1.7.0
    registry: local
  - name: golang.org/x/tools/cmd/deadcode@v0.49.0
    registry: local
  # Pseudo-version: the nested cmd/dot module carries no tags upstream, so
  # nothing for Renovate to propose either — bumped by hand, deliberately.
  - name: github.com/goccy/go-graphviz/cmd/dot@v0.0.0-20251129032125-76e04975df88
    registry: local
  - name: github.com/farcloser/godolint/cmd/godolint@v0.1.0
    registry: local
  # --- farcloser tools (local registry; standard once registered upstream) ---
  - name: farcloser/limen@v0.0.1 # renovate: depName=farcloser/limen
    registry: local
  # --- toolchain + binary-release tools (standard registry, aqua-verified) ---
  - name: golang/go@go1.26.6
  - name: casey/just@1.58.0
  - name: koalaman/shellcheck@v0.11.0
  - name: golangci/golangci-lint@v2.13.2
  - name: google/yamlfmt@v0.21.0
  - name: lycheeverse/lychee@lychee-v0.24.2
  - name: goreleaser/goreleaser@v2.17.1
  - name: sigstore/cosign@v3.1.3
  - name: gotestyourself/gotestsum@v1.13.0
  - name: jqlang/jq@jq-1.8.2
  - name: cli/cli@v2.96.0
