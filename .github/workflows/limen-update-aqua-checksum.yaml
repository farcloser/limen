# DO NOT EDIT MANUALLY: content-pinned by limen, reset on drift.
# The steps of the checksum-update workflow, as a reusable workflow called
# from every repository's update-aqua-checksum.yaml
# (`uses: farcloser/limen/.github/workflows/limen-update-aqua-checksum.yaml@<sha>`,
# the sha Renovate moves), so a change to them reaches a repository as a
# one-line bump in a Renovate commit, never as a workflow file a fix-up has
# to write.
#
# Generic, no project content. Renovate's other half: on its branches,
# regenerate .hermetic/aqua-checksums.json (a bumped pin with a stale checksum breaks
# every install) and, when the branch bumps farcloser/limen, run the branch's
# own pinned `limen fix` so the canonical files move with the pin. One fix-up
# commit. Then, in a repository that declares files derived from its pins
# (.converge, book/tooling.md), the project's `converge` recipe regenerates
# them in a job that can write nothing, and a second commit carries what it
# changed there.
#
# A WRITE workflow, hardened:
# - `push:` on the branch prefix, never pull_request_target, and Renovate's
#   own pushes alone: a push by anyone else to a renovate/ branch runs
#   nothing here, so nobody is handed a commit signed as the bot over a tree
#   of their choosing.
# - No credential kept by checkout and no secrets in the update steps'
#   environment beyond the job's own token where a verifier must read from
#   GitHub.
# - A job that holds a write token runs no recipe code the branch controls:
#   nothing runs through `just` in `update` or `finish`. What runs in
#   `update` is aqua, and the limen release the branch selects by checksum;
#   `finish` runs nothing the branch declares, not even its pins: the
#   runner's own tools and this file. `converge`, the one job that runs a
#   recipe, holds contents: read and nothing else.
# - What `converge` produced reaches the branch as file contents, never as
#   code: its archive is read entry by entry and never unpacked, for the
#   paths .converge names alone, read by `finish` from the head it checks
#   out itself: tracked regular files, each under git's own name for it,
#   outside .git, .github, .limen and .hermetic. Anything else the recipe
#   touched fails the job, and nothing of that run is committed: code a
#   bumped artifact runs cannot write where the project did not say a
#   derived file lives.
# - The commit steps use runner tools only, the branch name reaches the
#   shell via env; no loop, since a commit made with the job's own token
#   triggers no workflows.
#
# The commits go through GraphQL createCommitOnBranch because GitHub signs
# those and the main ruleset requires signatures (see the commit step). Their
# author is github-actions[bot], the job's own token, which renovate.json's
# gitIgnoredAuthors names or Renovate stops rebasing. Such a push starts no
# run by itself: the pull request's runs are created awaiting approval, and
# `finish` approves them on the last head with the same token (no App, no
# secret).
name: limen-update-aqua-checksum

on:
  workflow_call:

permissions: {}

# Explicit bash: windows defaults to PowerShell, and bash brings -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  update:
    # The actor of a push is who pushed, and a rerun keeps it: the hosted
    # Renovate App alone.
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      # The commit this job pushed, empty when the tree was already in sync.
      oid: ${{ steps.commit.outputs.oid }}
      # The head the next jobs read: that commit, or the one that fired the run.
      head: ${{ steps.head.outputs.head }}
      # Whether the project declares derived files.
      converge: ${{ steps.declared.outputs.converge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Does the project declare derived files
        id: declared
        run: |
          if [ -f .converge ]; then
            echo "converge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recompute hermetic's digest for the version Renovate moved
        # Before setup-hermetic, which verifies the release's checksums.txt
        # against the digest pinned beside the version: Renovate moves that
        # version in this repository alone (the action is content-pinned
        # everywhere else) and never a digest, so a bump arrives with the old
        # one and the action would refuse its own download. Runner tools
        # only, on the release's own file; what then guards the bump's run is
        # the action's attestation check on the asset, and the digest written
        # here guards every run after, as the pin the fleet receives.
        if: github.repository == 'farcloser/limen'
        run: |
          action=.github/actions/setup-hermetic/action.yaml
          version="$(sed -n 's/^ *HERMETIC_VERSION: \(v[0-9][^ ]*\)$/\1/p' "$action")"
          [ -n "$version" ] || { echo "no HERMETIC_VERSION in $action" >&2; exit 1; }
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "${tmp}/checksums.txt" \
            "https://github.com/forkcloser/hermetic/releases/download/${version}/checksums.txt"
          sha="$(sha256sum "${tmp}/checksums.txt" | cut -d' ' -f1)"
          rm -rf "${tmp}"
          sed -i "s/^\( *HERMETIC_CHECKSUMS_SHA256: \)[0-9a-f]*$/\1${sha}/" "$action"
          echo "hermetic ${version}: checksums.txt digest ${sha}"

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic
        with:
          # No token for hermetic here: this job's token carries contents:write
          # and the steps below run a branch-declared binary. A rate-limit 403
          # fails loudly and is rerun; a write token in branch-controlled code
          # would not fail loudly.
          github-token: ""

      - name: Regenerate .hermetic/aqua-checksums.json
        # No tool install here: update-checksum only reads the manifest and
        # hashes upstream artifacts — the smallest possible surface for a
        # write job. It is what makes the branch's limen pin installable for
        # the converge step below: setup-hermetic linked the pins, and a link
        # fetches nothing, so from here on every command the job runs —
        # limen's verifiers (gh, cosign), the push's curl and jq — is the
        # branch's own pin on the hermetic PATH, pulled when first run and
        # verified against the checksums regenerated here, never the runner's
        # copy.
        run: hermetic update-checksum --prune

      - name: Converge the limen baseline
        # The link resolves the branch's own limen pin, verified with the
        # checksums from the step above. A released limen leaves its own pin
        # alone, and on a renovate/ branch (GITHUB_REF_NAME) it leaves
        # .hermetic/hermetic.yaml alone too: Renovate renders that file on
        # every run, so a line added here would be removed, added, removed,
        # the branch force-pushed each time. What the manifest lacks, fix adds
        # on main. Skipped in the limen repository: there the working tree IS
        # the next baseline.
        if: github.repository != 'farcloser/limen'
        run: limen fix .

      - name: Refresh the digests of pinned artifacts, if the project declares any
        # The same pinned release, on the project's pins.yaml: a version
        # Renovate moved gets its digest recomputed through the verifier the
        # entry declares (book/tooling.md, "Pinned artifacts"). The job's own
        # token, read-only in use, is what `gh attestation verify` needs to
        # ask GitHub for an attestation; the code holding it is the release
        # the branch selects by checksum, never recipe text. The verifiers a
        # method shells out to (gh, cosign) resolve on the PATH linked above.
        if: github.repository != 'farcloser/limen' && hashFiles('pins.yaml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: limen pins refresh

      - name: Commit the update through the API, if any
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
          # The job's own token. It may not write a file under
          # .github/workflows/: a limen bump moves a workflow caller by its
          # one uses: line in Renovate's own commit, and a drifted caller is
          # left for a hand push (the workflows rule), so the fix-up carries
          # checksums, actions and .limen/ alone.
          TOKEN: ${{ github.token }}
        run: |
          [ -z "$(git status --porcelain)" ] && { echo "checksums and baseline already in sync"; exit 0; }
          # GraphQL createCommitOnBranch, not `git commit` + push: those commits
          # are GitHub-signed, and the main ruleset requires signatures — an
          # unsigned fix-up commit made every aqua-bump PR unmergeable
          # (book/github.md).
          #
          # The whole dirty tree, on purpose: exactly three writers ran since
          # checkout (update-checksum, the pinned limen's fix and pins refresh), and a path
          # list baked into the older running workflow cannot know the new
          # baseline's surface.
          #
          # Limit of the mutation, accepted: FileAddition carries no file
          # mode, so an executable bit cannot travel — both writers here
          # only ever produce plain configuration files.
          # Every file the payload touches travels through a FILE, never a
          # command line. A converged baseline is ~120 kB of configuration,
          # ~160 kB once base64'd, and Linux caps a single argument at 128 kB
          # (MAX_ARG_STRLEN): passing the accumulated array as `--argjson` died
          # with "jq: Argument list too long" and left the branch with a bumped
          # pin, no checksum, and a red pipeline that never reached its first
          # recipe. `--rawfile` and `--slurpfile` read from disk; the request
          # body is uploaded from disk too.
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          printf '[]' > "${work}/additions.json"
          printf '[]' > "${work}/deletions.json"
          while IFS= read -r -d '' entry; do
            path="${entry:3}"
            if [ -f "${path}" ]; then
              base64 -w0 "${path}" > "${work}/blob"
              jq --arg path "${path}" --rawfile contents "${work}/blob" \
                '. + [{path: $path, contents: ($contents | rtrimstr("\n"))}]' \
                "${work}/additions.json" > "${work}/next"
              mv "${work}/next" "${work}/additions.json"
            else
              jq --arg path "${path}" '. + [{path: $path}]' \
                "${work}/deletions.json" > "${work}/next"
              mv "${work}/next" "${work}/deletions.json"
            fi
          # --untracked-files=all: by default a new directory is ONE entry,
          # `?? dir/`, which is not a file, would be sent as a deletion, and
          # its files never committed — any directory the pinned limen fix
          # seeds (.limen/tools/golangci-lint/ did) would be lost.
          done < <(git status --porcelain -z --untracked-files=all)
          # Signed-off-by: `just do lint commits` enforces DCO on the PR range,
          # bot commits included.
          jq -n \
            --arg query 'mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg head "$(git rev-parse HEAD)" \
            --slurpfile additions "${work}/additions.json" \
            --slurpfile deletions "${work}/deletions.json" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch},
              expectedHeadOid: $head,
              message: {
                headline: "chore: refresh checksums and converge the limen baseline",
                body: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
              },
              fileChanges: {additions: $additions[0], deletions: $deletions[0]}}}}' \
            > "${work}/payload.json"
          # GraphQL reports failure in-body over HTTP 200, so success is the
          # presence of the new commit oid, never the HTTP status. No --retry
          # and no -L, on purpose: this is a mutation guarded by
          # expectedHeadOid — a retry after a success that timed out on the
          # way back would fail on the moved head and report a commit that
          # landed as an error, and a redirect must never replay the POST.
          response="$(curl --proto '=https' --tlsv1.2 -fsS -X POST -H "Authorization: bearer ${TOKEN}" \
            --data-binary "@${work}/payload.json" https://api.github.com/graphql)"
          oid="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"${response}")"
          if [ -z "${oid}" ]; then
            echo "${response}" >&2
            exit 1
          fi
          echo "pushed ${oid}"
          echo "oid=${oid}" >> "$GITHUB_OUTPUT"

      - name: Name the head the next jobs read
        id: head
        env:
          OID: ${{ steps.commit.outputs.oid }}
        run: echo "head=${OID:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"

  converge:
    # The project's own recipe for the files a pin leaves stale (a lock file
    # an SDK bump moves): branch-controlled code, and whatever a bumped
    # artifact runs inside it, so the job reads the repository and writes
    # nothing; what it changed leaves as an artifact `finish` judges.
    needs: update
    if: needs.update.outputs.converge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.head }}
          persist-credentials: false

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      - name: Run the project's converge recipe
        run: just converge

      - name: Collect what it changed
        run: |
          out="${RUNNER_TEMP}/converge"
          mkdir -p "${out}/files"
          git status --porcelain -z --untracked-files=all > "${out}/status"
          while IFS= read -r -d '' entry; do
            path="${entry:3}"
            if [ -f "${path}" ] && [ ! -L "${path}" ]; then
              mkdir -p "${out}/files/$(dirname "${path}")"
              cp "${path}" "${out}/files/${path}"
            fi
          done < "${out}/status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: converge
          path: ${{ runner.temp }}/converge
          # A derived file under a dot directory is a file like another.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          # A rerun of the job finds the name taken on the run.
          overwrite: true

  finish:
    # Runs when there is a head to approve or a converge to judge, whatever
    # became of `converge` itself. No hermetic here: the job needs git, jq,
    # curl, unzip and gh, which the runner has, and a job that links no pin
    # runs nothing the branch chose.
    needs: [update, converge]
    if: ${{ !cancelled() && needs.update.result == 'success' && (needs.update.outputs.oid != '' || needs.update.outputs.converge == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # To approve the pull request's runs on the head pushed here or by
      # `update`: a called job's token gets what its own block names, within
      # the caller's grant.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.head }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.converge.result == 'success'
        with:
          name: converge
          path: ${{ runner.temp }}/converge
          # The archive as it was uploaded: the step below reads entries by
          # name and unpacks nothing, so no extractor writes anything in a
          # job that holds a write token.
          skip-decompress: true

      - name: Commit what converge changed, within what the project declares
        id: commit
        if: needs.converge.result == 'success'
        env:
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          # The declaration is read from this job's own checkout, never from
          # the artifact: one path a line, `#` lines and empty ones skipped.
          # A path is one tracked file under git's own name for it (`./x`,
          # `a//x` and a pathspec all name files the patterns below would
          # not see), regular, outside the directories that are git's,
          # GitHub's or limen's, and free of the characters unzip reads as a
          # pattern: the recipe's run can change a file the project named,
          # and create or reach nothing.
          : > "${work}/declared"
          while IFS= read -r line || [ -n "${line}" ]; do
            path="${line%$'\r'}"
            case "${path}" in
              '' | '#'*) continue ;;
            esac
            if [ "$(git ls-files -- "${path}")" != "${path}" ] || [ ! -f "${path}" ] || [ -L "${path}" ]; then
              echo "::error::.converge: ${path} is not a tracked regular file under that exact name"
              exit 1
            fi
            case "${path}" in
              .git/* | .github/* | .limen/* | .hermetic/* | *[\*\?\[\]\\]*)
                echo "::error::.converge: ${path} is not a path a derived file may have"
                exit 1
                ;;
            esac
            printf '%s\n' "${path}" >> "${work}/declared"
          done < .converge
          # One archive, whatever the action named it.
          archive="$(find "${RUNNER_TEMP}/converge" -maxdepth 1 -type f)"
          if [ ! -f "${archive}" ]; then
            echo "::error::the converge artifact is not one archive: ${archive}"
            exit 1
          fi
          if ! unzip -p "${archive}" status > "${work}/status"; then
            echo "::error::the converge artifact carries no status"
            exit 1
          fi
          # All of the run or none of it: a recipe that touched a file the
          # project did not declare is not committed in part. The status is
          # the recipe's job's word, so it can leave a change out, which
          # only withholds it; it cannot bring one in.
          undeclared=""
          while IFS= read -r -d '' entry; do
            path="${entry:3}"
            if ! grep -Fxq -- "${path}" "${work}/declared"; then
              undeclared="${undeclared} ${path}"
            fi
          done < "${work}/status"
          if [ -n "${undeclared}" ]; then
            echo "::error::converge changed what .converge does not declare:${undeclared}"
            exit 1
          fi
          printf '[]' > "${work}/additions.json"
          while IFS= read -r -d '' entry; do
            path="${entry:3}"
            # The entry's bytes, to a file of this job's: nothing is
            # unpacked, so a link or a path in the archive goes nowhere.
            if ! unzip -p "${archive}" "files/${path}" > "${work}/file"; then
              echo "::error::converge: ${path} changed and its contents are not in the artifact"
              exit 1
            fi
            cmp -s "${work}/file" "${path}" && continue
            base64 -w0 "${work}/file" > "${work}/blob"
            jq --arg path "${path}" --rawfile contents "${work}/blob" \
              '. + [{path: $path, contents: ($contents | rtrimstr("\n"))}]' \
              "${work}/additions.json" > "${work}/next"
            mv "${work}/next" "${work}/additions.json"
          done < "${work}/status"
          if [ "$(jq length "${work}/additions.json")" = 0 ]; then
            echo "the derived files are already in sync"
            exit 0
          fi
          # As in `update`: GitHub-signed, the payload from files, success
          # read from the oid, no retry and no redirect on a mutation.
          jq -n \
            --arg query 'mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg head "$(git rev-parse HEAD)" \
            --slurpfile additions "${work}/additions.json" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch},
              expectedHeadOid: $head,
              message: {
                headline: "chore: converge the files derived from the pins",
                body: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
              },
              fileChanges: {additions: $additions[0]}}}}' \
            > "${work}/payload.json"
          response="$(curl --proto '=https' --tlsv1.2 -fsS -X POST -H "Authorization: bearer ${TOKEN}" \
            --data-binary "@${work}/payload.json" https://api.github.com/graphql)"
          oid="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"${response}")"
          if [ -z "${oid}" ]; then
            echo "${response}" >&2
            exit 1
          fi
          echo "pushed ${oid}"
          echo "oid=${oid}" >> "$GITHUB_OUTPUT"

      - name: Approve the pull request's runs on the last head
        # A push made with the job's token starts no run by itself: the
        # pull_request runs for the new head are created awaiting approval,
        # which a token with actions: write may give — this one. A dispatch
        # would not do: GitHub creates dispatched runs and does not count
        # their checks for the pull request. Runs appear within seconds of
        # the push, one workflow at a time, not together: the loop goes on
        # approving until thirty seconds pass with none new, since the first
        # run seen is not the set. Whatever the steps above did, so the first
        # commit's runs report when the second was refused; and only while
        # that head is the branch's: the runs of a head another commit
        # followed are not the pull request's, and a rerun of this job, or a
        # push that came meanwhile, finds the branch elsewhere.
        if: ${{ !cancelled() && (steps.commit.outputs.oid != '' || needs.update.outputs.oid != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          OID: ${{ steps.commit.outputs.oid || needs.update.outputs.oid }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq .object.sha)"
          if [ "${head}" != "${OID}" ]; then
            echo "the branch is at ${head}, no longer at ${OID}: the runs to approve are that head's, and its own run's to approve"
            exit 0
          fi
          # The ids approved are kept: a run just approved can still read
          # action_required on the next listing, and a second approval fails.
          # A failed approval ends nothing: the run is tried again on the next
          # listing, and one the call approved despite its error is not
          # listed again. A rerun of this job approves what is still awaiting
          # on that head, while it is the branch's.
          approved=""
          left=""
          quiet=0
          for _ in $(seq 1 18); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${OID}&per_page=50" \
              --jq '.workflow_runs[] | select(.status == "action_required" or .conclusion == "action_required") | .id')" || runs=""
            new=""
            for id in $runs; do
              case " ${approved} " in
                *" ${id} "*) ;;
                *) new="${new} ${id}" ;;
              esac
            done
            left=""
            if [ -n "${new}" ]; then
              for id in ${new}; do
                if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null; then
                  echo "approved run ${id}"
                  approved="${approved} ${id}"
                else
                  echo "approval of run ${id} failed; tried again on the next listing"
                  left="${left} ${id}"
                fi
              done
              quiet=0
            elif [ -n "${approved}" ]; then
              quiet=$((quiet + 1))
              if [ "${quiet}" -ge 3 ]; then
                break
              fi
            fi
            sleep 10
          done
          if [ -z "${approved}" ]; then
            echo "::error::no run approved on ${OID} after three minutes: the pull request's checks will not report"
            exit 1
          fi
          if [ -n "${left}" ]; then
            echo "::error::run(s)${left} on ${OID} still awaiting approval after three minutes: their checks will not report"
            exit 1
          fi

      - name: Say that converge failed
        # The recipe's own failure: nothing of it was committed, the runs of
        # the head above are approved, and this run is red for it.
        # Timed out counts: such a job is not reported as failed.
        if: ${{ !cancelled() && needs.converge.result != 'success' && needs.converge.result != 'skipped' }}
        run: |
          echo "::error::the project's converge recipe did not finish: the derived files were left as they were"
          exit 1
