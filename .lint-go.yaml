# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml,
# which this repository authors and every other one carries pinned): the
# baseline's sections, in its shape, holding only what this project adds,
# changes or takes out (book/per-language.md, "one baseline, per-project
# carve-outs"). `just do lint go` renders the two on every run.
golangci:
  linters:
    exclusions:
      rules:
        # Structs in internal/github mirror the GitHub REST API, whose wire
        # format is snake_case — the tags are the wire's, not ours to restyle.
        - path: internal/github/
          linters:
            - tagliatelle
        # Tests are black-box consumers: the rules about API hygiene and
        # production robustness do not apply to them, the rules about
        # correctness do (errcheck stays on: a test that ignores an error can
        # pass for the wrong reason).
        - path: _test\.go
          linters:
            - dupl # test cases are meant to look alike
            - dupword # test data
            - err113 # dynamic errors are fine in fixtures
            - dogsled # multiple-return helpers are exercised for one value at a time
            - noctx # no cancellation to propagate
            - perfsprint # readability over allocations
            - mnd # fixture values
