# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser — https://goreleaser.com — release automation for the limen CLI.
# Local dry-run: `just do release --local --dry-run` (no tag, no publish, artifacts under
# .build/). Real release: `just do release vX.Y.Z` (see the root .justfile).
version: 2

project_name: limen

# Everything lands under .build/release/ — covered by the canonical .gitignore
# (/build); goreleaser's default dist/ is not. A subdirectory of .build/, not
# .build/ itself: goreleaser --clean wipes its dist directory, and the dev
# builds (.build/limen*), coverage, and profiles the other recipes put in
# .build/ must survive a release run.
dist: .build/release

# The tools modules' go.mod files go into the binary, so `limen fix` seeds a
# missing tool directive at the versions this release was tested with, never
# at @latest (internal/toolpins). go:embed cannot reach them where they live,
# each being a module of its own, so internal/toolpins/copy.sh copies them
# first, into a directory whose contents are gitignored: the tree stays clean,
# and a development build, which skips this, embeds none and refuses to seed.
# A tools module missing here would ship a release that refuses too, so the
# copy fails loud.
before:
  hooks:
    - sh internal/toolpins/copy.sh

# Twin of the `release` recipe in .limen/just/build-go.just — the developer-facing
# builder. A flag change here must land there too (and vice versa); the
# intended differences are: the version stamp source ({{ .Version }} here,
# `git describe` there — identical on a release tag), mod_timestamp
# (reproducibility is a shipped-artifact concern), the target matrix
# (releases cross-compile, dev builds are native), and the toolpins stamp
# (only a release carries tool pins).
builds:
  - main: ./cmd/limen
    binary: limen
    # CGO off, categorically: it is what makes the whole target matrix
    # buildable from one laptop (each foreign target would otherwise need its
    # platform's C cross-toolchain).
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    buildmode: pie
    # No-ops under CGO_ENABLED=0 (pure Go already) — stated for parity with
    # the just builder, where they keep DNS and user lookups out of libc.
    tags:
      - netgo
      - osusergo
    # The toolpins stamp marks a binary built here: only it reads the go.mod
    # copies the before hook embedded, so a development build made after a
    # local dry run, which leaves the copies in place, embeds them unread.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X github.com/farcloser/limen/internal/toolpins.stamp=release
    # Exactly the platforms .hermetic/hermetic.yaml lists under checksum.supported_envs.
    targets:
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
    # Reproducible builds: stamp the commit time, not the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"

  # limen-lint-go, the Go lint driver every Go repository's lint recipes run
  # (book/linting-go.md, "one baseline, per-project carve-outs"): a module
  # of its own under cmd/ — its YAML parser must not enter limen's go.mod —
  # built here so it ships in the same archive, verified by the same
  # checksum and signature, and pinned by the same aqua entry as limen; the
  # baseline it reads, .limen/lint-go.yaml, moves with limen's releases like
  # every canonical file. Same flags as limen's build, minus the version stamp
  # it has no use for.
  - id: limen-lint-go
    dir: cmd/limen-lint-go
    main: .
    binary: limen-lint-go
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    buildmode: pie
    tags:
      - netgo
      - osusergo
    ldflags:
      - -s -w
    targets:
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

# One archive per platform carrying both binaries (no ids: every build).
archives:
  - formats: ["tar.gz"]

checksum:
  # The single checksums file aqua verifies release assets against.
  name_template: checksums.txt

# One SBOM per archive (SPDX JSON, syft from the toolset, goreleaser's
# defaults otherwise), listed in checksums.txt like the archives, so the
# signature below and the workflow's attestation cover it; the SBOM of an
# archive is read off the Go binaries' embedded build information, so it names
# every module the release was built from (book/releasing.md, "The signing and
# provenance policy").
# goreleaser runs the SBOM command with a stripped environment (HOME, PATH,
# TMPDIR and their kin, nothing else), so hermetic's two variables are handed
# back explicitly: without them the syft link resolves against the default
# root, not the one setup-hermetic or a laptop exported. Empty is unset for
# hermetic, so a machine on the default root is unaffected. Setting env
# replaces goreleaser's default list, hence the cataloger flag it carries;
# the update check is off, a pinned tool asks nobody for a newer one.
sboms:
  - artifacts: archive
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
      - SYFT_CHECK_FOR_APP_UPDATE=false
      - HERMETIC_ROOT_DIR={{ envOrDefault "HERMETIC_ROOT_DIR" "" }}
      - HERMETIC_CONFIG={{ envOrDefault "HERMETIC_CONFIG" "" }}

# cosign (v3, Sigstore bundle format) over the checksums file — signing that
# one file transitively covers every artifact it lists. Keyless, in CI only
# (the release workflow runs `just do release --ci`): no key exists anywhere.
# cosign exchanges the workflow's OIDC token (id-token: write) for a
# short-lived Fulcio certificate whose identity IS the workflow@tag, and the
# signature is logged in Rekor. Verify against that identity:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       'https://github.com/<owner>/<repo>/\.github/workflows/release\.yaml@refs/tags/v.*' \
#     checksums.txt
# The release workflow then attests every archive, SBOM and checksums.txt
# (GitHub build provenance), checked without cosign:
#   gh attestation verify <asset> --repo <owner>/<repo>
# A local run is `--local --dry-run`, which skips signing: there is no
# key-based lane (book/releasing.md).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle
      - "${signature}"
      - "${artifact}"

release:
  # Any prerelease-suffixed tag (e.g. the disposable v0.0.0-test.N tags used to
  # exercise the pipeline) is published as a GitHub prerelease, so it can never
  # become the repo's "latest release".
  prerelease: auto
  # Laptop releases fail halfway (network, guards) and get retried: overwrite
  # assets a previous partial attempt already uploaded instead of 422-ing on
  # "already_exists". Same-tag reruns are deliberate retries here by design —
  # the release recipe only reuses a tag that still points at HEAD.
  replace_existing_artifacts: true

changelog:
  use: github-native
